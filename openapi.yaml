openapi: 3.0.4
info:
  title: JWT Decoder
  description: >-
    JWT Decoder decodes JWT tokens to reveal header and payload information, and
    on paid plans verifies the signature against a public key you supply. It
    handles JSON web token decode from any language over REST, so you can
    inspect claims and expiry without adding a JWT library.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/jwtdecoder:
    post:
      summary: JWT Decoder
      description: >-
        Decode a JWT token, and optionally verify its signature against a public
        key (paid plans)
      operationId: jwtdecoder
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  header:
                    alg: RS256
                    typ: JWT
                    kid: sample-key-1
                  payload:
                    sub: '1234567890'
                    name: John Doe
                    iss: https://auth.example.com
                    aud: api.example.com
                    iat: 1767225600
                    exp: 2082758400
                  signature: hP0O9ELZGk-KN3upyYqdOnPY2Ig7FAzfUY_xytzOCBIhn0_TWdzl2dbLPlj0rkCDsRIQX0I5t9Xv551VI1W9dmvRGtVztyeD3IKHnIn24baOUtjU7Eb6FHL_iWMu5PqMeQJPFytuYbYhzjjCNfFPgAciGgn1Celr8H7_q51x5naMb-nbTvBc5SIX9MBnegGzabExBYQ-OsdKOoYmK0uymNIgC3834jlPuhuJHkPsxX7ncKoSQ4wheiLaZDwFANlT1NrD2XgKyyh-LIIg9CRwqB_WDktZ_R6UusNkLRhKJ20ff29ttkyRhJZzEqRRK60xYn7iPyg4YQni1J_w-oAa_w
                  isExpired: false
                  expiresAt: '2036-01-01T00:00:00.000Z'
                  issuedAt: '2026-01-01T00:00:00.000Z'
                  tokenAge: 309 days
                  algorithm: RS256
                  expiresIn: 288757380
                  notYetValid: false
                  securityAnalysis:
                    isUnsecured: false
                    hasExpiration: true
                    isLongLived: true
                    issues:
                      - Token lifetime exceeds 24 hours
                  warning: Signature verified with the supplied public key.
                  signatureVerification:
                    verified: true
                    algorithm: RS256
                    keyType: RSA
                    reason: null
                    claimsValid: true
                    claimsReason: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token to decode
                publicKey:
                  type: string
                  description: >-
                    Public key to verify the signature with: a PEM public key, a
                    PEM X.509 certificate, or a JWK (as a JSON object or
                    string). Asymmetric algorithms only; HMAC secrets are
                    refused and keys are never fetched from URLs. Omit it to
                    decode only.
              required:
                - token
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
